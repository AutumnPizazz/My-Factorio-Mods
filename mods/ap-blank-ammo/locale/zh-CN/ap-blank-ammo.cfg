[mod-name]
ap-blank-ammo=空气空包弹

[mod-description]
ap-blank-ammo=在组装机中无需任何原料即可制造低伤害空包弹，为资源匮乏环境下的机枪塔提供应急弹药。禁止手工制作和太空平台生产。兼容 Krastorio 2 与 Krastorio 2 Spaced Out。

[item-name]
ap-blank-rounds-magazine=空包弹匣

[item-description]
ap-blank-rounds-magazine=低伤害应急弹药。无需任何原料，仅限组装机制造，无法在太空平台生产。

[recipe-name]
ap-blank-rounds-magazine=空包弹匣

[recipe-category-name]
ap-blank-ammo-crafting=空包弹装配

[surface-property-name]
ap-blank-ammo-production=空包弹生产条件

[surface-property-unit]
ap-blank-ammo-production=__1__

[mod-setting-name]
ap-blank-ammo-damage=空包弹基础伤害
ap-blank-ammo-crafting-time=空包弹匣制造时间

[mod-setting-description]
ap-blank-ammo-damage=每发子弹的基础物理伤害，尚未计算弹药科技、炮塔加成及目标抗性。
ap-blank-ammo-crafting-time=制造每匣弹药所需的基础秒数，以制造速度 1 计算。实际生产时间受组装机速度影响。

[mod-name]
space-platform-thrust-physics=太空平台推力物理

[mod-description]
space-platform-thrust-physics=用更符合物理直觉的模型替换原版太空平台推力-速度公式：推力与质量决定加速度，速度本身产生微弱阻力抵消推力。\n\n[font=default-bold]模型：[/font]加速度 = (推力 - 阻力) / 质量 / 60，阻力与速度成正比（并可再按可配置的指数取决于飞船宽度、高度与质量）。质量只影响加速快慢；最高速由总推力与“船体阻力大小”共同决定。\n\n[font=default-bold]注意：[/font]所有选项均为“启动时”设置，修改后需要重新载入存档 / 重启游戏才会生效。

[mod-setting-name]
sptp-drag-model=阻力模型
sptp-reference-thrust-gn=参考推力
sptp-reference-top-speed=参考推力下的最高速
sptp-drag-strength=阻力强度倍率
sptp-reference-width=参考宽度
sptp-width-exponent=宽度指数
sptp-reference-height=参考高度
sptp-height-exponent=高度指数
sptp-reference-weight-tons=参考质量
sptp-weight-exponent=质量指数
sptp-keep-heavy-mass-penalty=保留原版“重质量惩罚推力”项
sptp-speed-cap=硬性最高速上限
sptp-custom-expression=自定义加速度表达式

[mod-setting-description]
sptp-drag-model=linear：阻力与速度成正比，最高速与推力成正比。quadratic：阻力与速度平方成正比，最高速与推力的平方根成正比。\n默认：quadratic（推力-速度关系与原版 2.1.21 一致，只是把变化的“质量”换成了固定基准）
sptp-reference-thrust-gn=在“参考尺寸、阻力强度 1.0”的前提下，达到“参考推力下的最高速”所需的推力（单位 GN）。默认 61.2 GN = 4 台传说推进器满推力。\n范围：0.001 - 1000000
sptp-reference-top-speed=当平台总推力等于“参考推力”、尺寸等于“参考尺寸”、阻力强度为 1.0 时能达到的最高速（单位 km/s）。调低则所有飞船变慢，调高则变快。\n默认：1000\n范围：1 - 10000000
sptp-drag-strength=施加在阻力上的整体倍率。小于 1.0 更快，大于 1.0 更慢；0 表示完全没有阻力。\n默认：1\n范围：0 - 1000
sptp-reference-width=尺寸系数恰好为 1.0 的飞船宽度（单位格）。宽度指数大于 0 时，比它宽的飞船阻力更大，比它窄的阻力更小。\n默认：17\n范围：1 - 10000
sptp-width-exponent=宽度对阻力的影响强度：系数 = (宽度 / 参考宽度) ^ 指数。\n0 = 宽度完全不影响；1 = 阻力与宽度成正比；0.5 = 阻力随宽度的平方根增长（惩罚更温和）。\n默认：1\n范围：-10 - 10
sptp-reference-height=尺寸系数恰好为 1.0 的飞船高度（单位格）。仅当高度指数不为 0 时使用。\n默认：17\n范围：1 - 10000
sptp-height-exponent=高度对阻力的影响强度：系数 = (高度 / 参考高度) ^ 指数。设为 0 表示忽略高度。\n默认：0（忽略高度）\n范围：-10 - 10
sptp-reference-weight-tons=尺寸系数恰好为 1.0 的飞船质量（单位吨）。仅当质量指数不为 0 时使用。\n默认：1000\n范围：0.001 - 100000000
sptp-weight-exponent=质量对阻力的影响强度：系数 = (质量 / 参考质量) ^ 指数。设为 0 表示忽略质量（此时质量只影响加速度）。\n默认：0（忽略质量）\n范围：-10 - 10
sptp-keep-heavy-mass-penalty=启用后，等效推力将像原版一样除以 (1 + 质量/10000000)，使超重平台的推力与最高速下降。默认关闭：质量应当只影响加速度。
sptp-speed-cap=大于 0 时，速度接近该值时加速度线性衰减到 0，形成硬性最高速上限。\n默认：0（禁用）\n范围：0 - 100000000
sptp-custom-expression=进阶：若不为空，则把该表达式原样写入 space_platform_acceleration_expression，并忽略上方所有选项。可用变量：speed（km/s）、thrust（N）、weight（kg）、width、height；可用函数：abs()、log2()、sign()、min()、max()。\n警告：表达式非法会导致游戏加载失败。日常使用请留空。

[mod-name]
space-platform-thrust-physics=Space Platform Thrust Physics

[mod-description]
space-platform-thrust-physics=Replaces the vanilla space platform thrust/speed formula with a physically intuitive model: thrust and mass determine acceleration, while velocity itself produces a weak drag that counteracts thrust.\n\n[font=default-bold]Model:[/font] acceleration = (thrust - drag) / mass / 60, with drag proportional to speed (and optionally to the platform's width, height and mass through configurable exponents). Mass only affects how fast you accelerate; the top speed is decided by the total thrust and how "draggy" the hull is.\n\n[font=default-bold]Note:[/font] all options are startup settings, so changing them requires reloading the save / restarting the game.\n\n用更符合物理直觉的模型替换原版太空平台推力-速度公式：推力与质量决定加速度，速度本身产生微弱阻力抵消推力。阻力可再按可配置的指数取决于飞船宽度、高度与质量。所有选项均为“启动时”设置。

[mod-setting-name]
sptp-drag-model=Drag model
sptp-reference-thrust-gn=Reference thrust
sptp-reference-top-speed=Top speed at reference thrust
sptp-drag-strength=Drag strength multiplier
sptp-reference-width=Reference width
sptp-width-exponent=Width exponent
sptp-reference-height=Reference height
sptp-height-exponent=Height exponent
sptp-reference-weight-tons=Reference mass
sptp-weight-exponent=Mass exponent
sptp-keep-heavy-mass-penalty=Keep vanilla heavy-mass thrust penalty
sptp-speed-cap=Hard speed cap
sptp-custom-expression=Custom acceleration expression

[mod-setting-description]
sptp-drag-model=linear: drag grows in proportion to speed, so top speed is proportional to thrust. quadratic: drag grows with speed squared, so top speed is proportional to the square root of thrust.\nDefault: quadratic (its thrust-to-speed scaling matches vanilla 2.1.21, only with a fixed reference mass instead of the real one)
sptp-reference-thrust-gn=The thrust (in GN) that should reach "Top speed at reference thrust", assuming the reference size and drag strength 1.0. Default 61.2 GN = 4 legendary thrusters at full thrust.\nRange: 0.001 - 1000000
sptp-reference-top-speed=The top speed (in km/s) reached by a platform whose total thrust equals the reference thrust, whose size equals the reference size and whose drag strength is 1.0. Lower it to slow every ship down, raise it to speed everything up.\nDefault: 1000\nRange: 1 - 10000000
sptp-drag-strength=Global multiplier applied to drag. Below 1.0 = faster ships, above 1.0 = slower ships. 0 removes drag entirely.\nDefault: 1\nRange: 0 - 1000
sptp-reference-width=The platform width (in tiles) at which the size factor is exactly 1.0. Wider platforms than this get more drag, narrower ones less (when the width exponent is above 0).\nDefault: 17\nRange: 1 - 10000
sptp-width-exponent=How strongly the platform width scales the drag: factor = (width / reference width) ^ exponent.\n0 = width has no effect. 1 = drag is proportional to width. 0.5 = drag grows with the square root of width (a gentler penalty).\nDefault: 1\nRange: -10 - 10
sptp-reference-height=The platform height (in tiles) at which the size factor is exactly 1.0. Only used when the height exponent is not 0.\nDefault: 17\nRange: 1 - 10000
sptp-height-exponent=How strongly the platform height scales the drag: factor = (height / reference height) ^ exponent. Set to 0 to ignore height.\nDefault: 0 (height ignored)\nRange: -10 - 10
sptp-reference-weight-tons=The platform mass (in tons) at which the size factor is exactly 1.0. Only used when the mass exponent is not 0.\nDefault: 1000\nRange: 0.001 - 100000000
sptp-weight-exponent=How strongly the platform mass scales the drag: factor = (mass / reference mass) ^ exponent. Set to 0 to ignore mass (mass then only affects acceleration).\nDefault: 0 (mass ignored)\nRange: -10 - 10
sptp-keep-heavy-mass-penalty=If enabled, effective thrust is divided by (1 + weight / 10000000) exactly like vanilla, so very heavy platforms lose thrust and top speed. Disabled by default, because mass should only affect acceleration.
sptp-speed-cap=If above 0, acceleration fades linearly to zero as speed approaches this value, giving a hard top speed limit.\nDefault: 0 (disabled)\nRange: 0 - 100000000
sptp-custom-expression=Advanced: if not empty, this exact expression is written to space_platform_acceleration_expression and all other options above are ignored. Available variables: speed (km/s), thrust (N), weight (kg), width, height; available functions: abs(), log2(), sign(), min(), max().\nWARNING: an invalid expression will make the game fail to load. Leave empty for normal use.

[mod-setting-description]
rampantFixed--allowExternalControl=允许其他模组不仅读取Rampant的数据，还能设置其数值。已过时。从1.8.3版本起，始终允许外部控制。
rampantFixed--unitAndSpawnerFadeTime=虫族尸体存留的时间（秒）
rampantFixed--oldRedEnemyMapColor=将敌人地图颜色恢复为原版敌人地图颜色
rampantFixed--unitSpawnerBreath=现在单位孵化器（巢穴）需要呼吸空气，因此会受到毒气胶囊等影响
rampantFixed--attackWaveGenerationThresholdMax=区块必须达到的总分数才能生成攻击波。不影响原版虫族波次。随进化因子线性缩放（起始阈值 @ 0.0 进化）
rampantFixed--attackWaveGenerationThresholdMin=区块必须达到的总分数才能生成攻击波。不影响原版虫族波次。随进化因子线性缩放（结束阈值 @ 100.0 进化）
rampantFixed--attackWaveMaxSize=如果你想改变攻击波随进化的缩放方式，你需要修改压缩包中的config.lua文件。
rampantFixed--attackWaveMaxSizeEvoPercent=如果你希望更早获得最大规模的攻击，请指定所需的百分比
rampantFixed--agressiveStart=小队规模和攻击频率将至少从30%进化度开始计算。此等级将在游戏开始1小时后达到
rampantFixed--safeBuildings=必须启用以下“安全”设置才能生效。之前建造的物体可能被摧毁，但会自动恢复并变为无敌
rampantFixed--safeBuildings-straightRail=使轨道及相关基础设施免受虫族攻击
rampantFixed--safeBuildings-bigElectricPole=使大型电塔免受虫族攻击
rampantFixed--safeBuildings-lamps=使灯免受虫族攻击
rampantFixed--safeBuildings-trainStops=使火车站免受虫族攻击
rampantFixed--permanentNocturnal=启用此项将导致Rampant攻击波在夜间生成。与时钟模组或延长黑夜的模组一起使用效果更好。
rampantFixed--allowDaytimePlayerHunting=允许虫族随时猎杀玩家
rampantFixed--allowDaytimeNonRampantActions=允许全天候的标准污染攻击、定居、其他模组的攻击
rampantFixed--aiPointsScaler=在0.0到100.0之间。这将缩放AI每个逻辑周期获得多少行动点数来执行诸如生成攻击波等操作。0.3 - 非常容易，0.75 - 容易，1.0 - 中等，1.25+ - 困难
rampantFixed--aiDifficulty=困难 - 默认等级。轻松 - 为了更舒适的游戏。对玩家行为的反应更弱，攻击频率更低
rampantFixed--aiPointsPrintSpendingToChat=每当Rampant消耗点数时，在聊天中打印消息。包含GPS坐标。为获得最难的Rampant体验，请保持禁用。注意：激烈战斗时可能快速刷屏！
rampantFixed--aiPointsPrintGainsToChat=每当Rampant获得点数时，在聊天中打印消息。不显示被动点数生成。为获得最难的Rampant体验，请保持禁用。注意：激烈战斗时可能快速刷屏！
rampantFixed--addWallResistanceAcid=启用此项将为所有墙壁实体添加60%酸液、75%毒液抗性和30点爆炸伤害减免。
rampantFixed--removeBloodParticles=虫族被杀死时产生的血迹粒子可能导致UPS骤降，此项移除它们。
rampantFixed--fireSafety-flamethrower=手持火焰喷射器不会引发火灾，而是造成直接的区域效果伤害。显著减少附近有多个虫族时的游戏延迟
rampantFixed--flamethrowerTurretsRebalance=降低攻击速度，同时保持总体伤害。对于Rampant Arsenal的火焰喷射器，它可以消除非常显著的延迟
rampantFixed--rampantArsenalRebalance=酸液和毒药贴片伤害将降低频率，但威力更强。显著减少使用毒药和酸液时的后期游戏延迟
rampantFixed--enableSwarm=这将减小单位的碰撞掩码，使其减少路径碰撞并使攻击更流畅
rampantFixed--attack-warning=显示消息警告玩家攻击波即将到来
rampantFixed--newEnemies=添加将在世界各地分布的新敌人。这会增加内存需求。如果每个虫族、蠕虫、巢穴有1个变体且5个等级，预计内存增加最多2GB。如果20个变体且10个等级，预计内存增加最多9GB。变体为每个等级的虫族、蠕虫或巢穴增加随机性。等级是虫族的强度等级。
rampantFixed--allowOtherEnemies=仅限新游戏或没有Rampant的地图。限制<新敌人>的放置，为其他模组的敌人留出空间。如果禁用，则其他模组的巢穴会偶尔在随机位置出现，而标准敌人将被<新敌人>替换
rampantFixed--newEnemiesSide=仅限新游戏或没有Rampant的地图。如果启用了<允许其他敌人>设置，新派系将仅出现在指定侧
rampantFixed--newEnemyVariations=仅用于与Rampant兼容。所有新对象将如同变体数量等于1一样生成
rampantFixed--tierStart=这是敌人的起始等级，用于为指定等级数生成敌人集合，并线性增加到最终等级。大致上每个等级的生命值如下 (1-15,2-75,3-150,4-250,5-1000,6-2000,7-3500,8-7500,9-15000,10-30000)。最小值 1，最大值 10
rampantFixed--tierEnd=这是从起始等级线性增加后达到的最终等级。大致上每个等级的生命值如下 (1-15,2-75,3-150,4-250,5-1000,6-2000,7-3500,8-7500,9-15000,10-30000)。最小值 1，最大值 10，推荐 =5（比正常虫族稍弱）
rampantFixed--allowLongRangeImmunity=部分派系无法在远距离被杀死。火焰和酸液伤害忽略此免疫。禁用此设置可能使这些派系过弱
rampantFixed--longRangeImmunity_efficiency=100% - 对来自N+射程的伤害免疫。10% - 将承受90%伤害
rampantFixed--allowOneshotProtection=部分派系需要多次命中才能死亡。火焰和酸液伤害忽略此保护。禁用此设置可能使这些派系过弱
rampantFixed--oneshotProtection_efficiency=100% - 承受的伤害不能超过过载伤害阈值。10% - 过载伤害将减少10%
rampantFixed--buildingsImmuneToElectic=巢穴和蠕虫不受电能伤害

rampantFixed--enableMigration=AI将开始占领整个地图。尊重地图的虫族扩张设置。（小心！这是困难模式！）
rampantFixed--printAIStateChanges=在游戏聊天中提供Rampant AI状态的信息。每个地表都会显示消息。为获得最难的Rampant体验，请禁用。
rampantFixed--debugTemperament=在聊天中打印控制AI状态投点的AI性情信息。用于调试。
rampantFixed--max-evo-dist=数值越高，强派系出现位置距离中心越远

rampantFixed--enableShrinkNestsAndWorms=将巢穴和蠕虫的碰撞箱大小减小50%。可能导致实体图形重叠，因为碰撞箱比实体图形小。
rampantFixed--attackWaveGenerationUsePlayerProximity=在拥有虫族巢穴的区块上，将玩家信息素数量纳入生成Rampant攻击波的阈值计算。不影响原版虫族波次
rampantFixed--attackPlayerThreshold=区块必须达到的分数才能贡献于攻击阈值。增加此值会降低玩家信息素云的影响。

rampantFixed--unkillableLogisticRobots=这将使物流机器人对所有伤害免疫
rampantFixed--unkillableConstructionRobots=这将使建筑机器人对所有伤害免疫

rampantFixed--unitBiterHealthScaler=按百分比缩放所有新敌人虫族的生命值
rampantFixed--unitBiterSpeedScaler=按百分比缩放所有新敌人虫族的速度
rampantFixed--unitBiterDamageScaler=按百分比缩放所有新敌人虫族的伤害
rampantFixed--unitBiterRangeScaler=按百分比缩放所有新敌人虫族的攻击范围
rampantFixed--unitBiterHealingScaler=按百分比缩放所有新敌人虫族的治疗
rampantFixed--unitSpitterHealthScaler=按百分比缩放所有新敌人喷吐虫的生命值
rampantFixed--unitSpitterSpeedScaler=按百分比缩放所有新敌人喷吐虫的速度
rampantFixed--unitSpitterDamageScaler=按百分比缩放所有新敌人喷吐虫的伤害
rampantFixed--unitSpitterRangeScaler=按百分比缩放所有新敌人喷吐虫的攻击范围
rampantFixed--unitSpitterHealingScaler=按百分比缩放所有新敌人喷吐虫的治疗
rampantFixed--unitDroneHealthScaler=按百分比缩放所有新敌人无人机的生命值。无人机来自孵化者和黄蜂派系
rampantFixed--unitDroneSpeedScaler=按百分比缩放所有新敌人无人机的速度。无人机来自孵化者和黄蜂派系
rampantFixed--unitDroneDamageScaler=按百分比缩放所有新敌人无人机的伤害。无人机来自孵化者和黄蜂派系
rampantFixed--unitDroneRangeScaler=按百分比缩放所有新敌人无人机的攻击范围。无人机来自孵化者和黄蜂派系
rampantFixed--unitDroneHealingScaler=按百分比缩放所有新敌人无人机的治疗。无人机来自孵化者和黄蜂派系
rampantFixed--unitWormHealthScaler=按百分比缩放所有新敌人蠕虫的生命值
rampantFixed--unitWormDamageScaler=按百分比缩放所有新敌人蠕虫的伤害
rampantFixed--unitWormRangeScaler=按百分比缩放所有新敌人蠕虫的攻击范围
rampantFixed--unitWormHealingScaler=按百分比缩放所有新敌人蠕虫的治疗
rampantFixed--unitSpawnerHealthScaler=按百分比缩放所有新敌人单位孵化器的生命值
rampantFixed--unitSpawnerOwnedScaler=按百分比缩放所有新敌人单位孵化器每个孵化器最大控制的单位数量
rampantFixed--unitSpawnerSpawnScaler=按百分比缩放所有新敌人单位孵化器单次孵化的单位数量
rampantFixed--unitSpawnerRespawnScaler=按百分比缩放所有新敌人单位孵化器孵化新单位的时间
rampantFixed--unitSpawnerHealingScaler=按百分比缩放所有新敌人单位孵化器的治疗
rampantFixed--unitHiveHealthScaler=按百分比缩放所有新敌人单位蜂巢的生命值
rampantFixed--unitHiveHealingScaler=按百分比缩放所有新敌人单位蜂巢的治疗
rampantFixed--unitHiveRespawnScaler=按百分比缩放所有新敌人单位蜂巢孵化新单位的时间

rampantFixed--raidAIToggle=切换AI对远方巢穴的突袭队伍
rampantFixed--siegeAIToggle=切换AI在玩家附近定居的围攻队伍
rampantFixed--siegeMinDistance=围攻不能在距离军事建筑指定区块数以内定居
rampantFixed--undergroundAttack=部分攻击将通过地下抵达目标。它们偏爱常规路径，但必要时会穿越任何地表。在地图上可见。可被炮塔拦截。此外，当用火炮轰击小队时，它们会挖掘并继续在地下攻击。无法穿越宽度超过2个区块的不可通行地形，除非是在报复火炮攻击时
rampantFixed--undergroundAttackProbability=概率取决于进化度。不影响被火炮轰击时的挖掘行为
rampantFixed--demolisherAttack_AdditionalTime=这些分钟将被添加到计算的标准间隔中

rampantFixed--laserEnemy=激光虫族派系，主要抗性为激光，次要抗性为电能。拥有虫族和喷吐虫单位类型。过载伤害保护1.5（约80%最大生命值伤害）
rampantFixed--waspEnemy=黄蜂虫族派系，仅喷吐虫单位，每个喷吐虫喷出小型无人机。
rampantFixed--spawnerEnemy=孵化者虫族派系，仅由孵化器生产的喷吐虫，喷吐虫产卵孵化出虫族。远距离免疫（30+）
rampantFixed--trollEnemy=再生虫族派系，高生命再生，主要弱点是火焰，次要抗性为物理，次要抗性为爆炸。过载伤害保护5（20%最大生命值伤害）
rampantFixed--fastEnemy=迅捷虫族派系，高移动速度，次要抗性为爆炸。过载伤害保护4（25%最大生命值伤害），远距离免疫（20+）
rampantFixed--infernoEnemy=炼狱虫族派系，仅喷吐虫，喷射燃烧的酸液灼烧一切。对酸液和火焰有极高抗性，次要弱点为毒液。主要弱点为激光
rampantFixed--nuclearEnemy=核能虫族派系，仅虫族单位，像原子弹一样爆炸。主要抗酸液和火焰。主要弱点为爆炸。快速，低生命值，过载伤害保护5（20%最大生命值伤害）
rampantFixed--electricEnemy=电能虫族派系，仅虫族单位，拥有短程攻击，可击中一条线上的多个实体。主要抗性为电能，次要抗性为激光。
rampantFixed--fireEnemy=火焰虫族派系，主要抗性为酸液。火焰免疫。激光弱点。火焰喷射攻击。
rampantFixed--ArachnidsEnemy=它们看起来像蜘蛛（如果安装了Arachnids模组）。易受物理伤害（x2）。死亡时留下虫卵，5秒后孵化出新虫族。虫卵易受物理伤害。该派系的目标是迫使玩家消耗弹药。
rampantFixed--suicideEnemy=自爆虫族派系，仅虫族单位，攻击时自爆。次要抗性为毒液、火焰，主要弱点为爆炸。快速，低生命值，过载伤害保护4（25%最大生命值伤害），远距离免疫（18+）
rampantFixed--physicalEnemy=装甲虫族派系，仅虫族单位。主要抗性为物理，主要抗性为爆炸，次要抗性为火焰。次要弱点为电能和激光。过载伤害保护2（50%最大生命值伤害）
rampantFixed--acidEnemy=酸性虫族派系，免疫酸液，次要抗性为毒液。
rampantFixed--energyThiefEnemy=电能吸取虫族派系，主要抗性为电能，次要抗性为激光。摧毁通电结构会产生吸取水晶。
rampantFixed--poisonEnemy=剧毒虫族派系，仅虫族单位。死亡时产生毒云，治疗虫族并伤害玩家物体。主要抗性为毒液，次要抗性为火焰。次要弱点为激光、电能。
rampantFixed--JuggernautEnemy=缓慢、大型虫族，对物理、酸液和火焰有极高抗性。毒云攻击，治疗盟友并伤害敌人。这是对你激光防御的DPS检查

rampantFixed--disableCollidingProjectiles=虫族弹射物不再与其他虫族、蠕虫或巢穴碰撞。其他所有东西仍会与虫族弹射物碰撞。
rampantFixed--enableFullMapScan=此设置会导致游戏地图被缓慢扫描，以查找在Factorio事件系统之外创建或销毁的实体。（如果某个模组没有使用script_raised_built或script_raised_destroyed，这将导致Rampant最终仍与游戏地图保持一致）

rampantFixed--enableFadeTime=启用消失时间以减少或增加虫族、喷吐虫、蠕虫、孵化器和蜂巢。如果禁用，则不对尸体时间做任何更改。

rampantFixed--maxNumberOfBuilders=更多建造者需要更多UPS。
rampantFixed--maxNumberOfSquads=更多小队需要更多UPS。
rampantFixed--settlementsProbability=默认值 = 0.4（40%定居，60%攻击）。仅适用于迁徙/围攻模式。不影响常规定居
rampantFixed--vengenceProbabilityPercent=默认值 = 0.04。改变每个虫族死亡后形成复仇小队的概率。
rampantFixed--chainVengenceCoefficient=默认值 = 0.6。每个后续复仇小队的概率乘以此系数。玩家新的侵略行为会立即将概率提升至原始值。标准攻击会逐渐增加概率。当AI行动点数过多时，效果减半
rampantFixed--showAdminMenu=单人游戏或管理员玩家。在屏幕顶部添加一个按钮。其菜单允许你将敌人替换为标准敌人，并指定要忽略的地表/星球
rampantFixed--showSquadAlert=显示Rampant AI小队警报

[description]
rampantFixed--EnemySettings1_1_9=Rampant Fixed：自1.1.9版本起，支持Rampant与其他敌人的混合定居（参见启动设置）。仅在新游戏中。
rampantFixed--EnemySettings1_1_10=Rampant Fixed：自1.1.10版本起，可以将新敌人的巢穴替换为标准巢穴。如果你希望在没有新敌人的情况下继续游戏，或在不丢失巢穴的情况下移除模组，这可能有用（玩家设置-“显示禁用新敌人的对话框”）。仅限单人游戏或“管理员”玩家
rampantFixed--enableShootingAlerts=Rampant Fixed：建议找到启用炮塔开火通知的方法。否则，你可能会错过攻击
rampantFixed--disableNewEnemies_text=所有星球上的巢穴都将被替换。不会恢复
rampantFixed--msg-ask-disableNewEnemies=将新敌人的巢穴替换为标准巢穴。在大地图上可能需要时间。开始替换吗？
rampantFixed--button_disableNewEnemies_disable=是（可能需要一些时间）
rampantFixed--button_disableNewEnemies_cancel=取消
rampantFixed--msg_replaceNewEnemiesNests=巢穴替换完成。已处理巢穴：__1__。如果需要，可以移除该模组。
rampantFixed--K2_SE_CMO_incompatibilityWarning=检测到K2+SE + combat-mechanics-overhaul模组组合。在此组合中，模组设置<combat-mechanics-overhaul>：喷吐虫/蠕虫唾沫可阻挡“[font=heading-1][color=red]错误地转换了[/color][/font]火焰和炼狱派系的攻击。如果启用了它们，则启用替代攻击（Rampant Fixed设置：弹射物：将蒸汽攻击替换为可阻挡的弹射物）
rampantFixed--undergroundAttackWarning=警告：__1__：虫族学会了地下攻击！坚硬地表（移动速度150+）将使挖掘过程延迟一分钟，
rampantFixed--undergroundAttackWarning2=降低虫族移动速度5秒，通知尝试挖掘或通过（如果在雷达覆盖范围内）
rampantFixed--firstUndergroundAttackWarning=检测到首次地下攻击（后续攻击将无提示）
rampantFixed--undergroundAttackDigoutWarning=警告：检测到挖掘尝试。坚硬地表将阻止其1分钟
rampantFixed--undergroundAttackDetectedWarning=检测到地下攻击！
rampantFixed--squadDetectedWarning=检测到Rampant AI小队。小队规模：__1__
rampantFixed--demolisherAttackDetectedWarning=检测到进攻的粉碎者

rampantFixed--JuggernautAlert=Rampant Fixed：注意！在82%进化度时可能出现巨兽派系！它们对火焰和物理伤害有极高的抗性。

rampantFixed--demolisherNote1=[color=red]__1__：粉碎者攻击。一旦攻击并让其存活，它会一次又一次地回来。[/color]通过摧毁它，你可以延迟另一个粉碎者攻击的时刻。
rampantFixed--demolisherNote2=攻击开始时，20%的情况下是现有粉碎者的完全复制体攻击。其他情况下会发生突变。仅限太空时代粉碎者会发生突变。
rampantFixed--demolisherNote3=在进化度__1__%时，可能突变为中型粉碎者。在__2__%时，突变为大型粉碎者。如果无法击杀，就喂养它。
rampantFixed--demolisherNotFeeded=__1__：粉碎者已饱食，对食物无反应。
rampantFixed--demolisherFeeded_Hunger=__1__：你已喂养粉碎者，它只会在__2__分钟后回来。它还能进食__3__次。食物即将生效
rampantFixed--demolisherFeeded_noHunger=__1__：你已喂养粉碎者，它只会在__2__分钟后回来。它不想再吃了。食物即将生效
rampantFixed--demolisherFeared=__1__：你吓跑了粉碎者，它们只会在__2__分钟后回来

rampantFixed--NEW_ENEMIES_SIDE_ignored=Rampant Fixed：新敌人派系放置侧设置已更改。其更改仅在游戏开始时可用，将被忽略

[entity-description]
regenerationCrystal-rampantFixed=[color=green]可开采\n开启时给予友方玩家再生效果\n在50+和70+进化度时效果提升3倍[/color][color=red]\n施加增益时可能损坏[/color]
lootStone_Combat5-rampantFixed=战利品石\n开采或摧毁它
biterSupressor1-rampant=用于降低临时离开星球的威胁[color=green]\n将Rampant AI的攻击频率降低3倍。在防线被突破时防止大规模攻击[/color]\n不影响粉碎者、污染攻击或巢穴被毁反应[color=red]\n当玩家物理存在于星球上时，正面效果不生效。\n放置2个或以上时，正面效果不叠加[/color]
biterSupressor2-rampant=用于降低临时离开星球的威胁\n包含前一版本功能，外加：[color=green]\n将粉碎者攻击间隔延长1.5倍。对喂食也生效\n将由Rampant AI控制的攻击小队最大规模减半[/color]
biterSupressor3-rampant=用于降低临时离开星球的威胁\n包含前一版本功能，外加：[color=green]\n在100%持续供电情况下，星球上的进化度将不会增长[/color]

[item-name]
powerup-Combat5min-Capsule-rampantFixed=强化：战斗（5分钟）
demolisher-food-rocket-rampant=粉碎者食物火箭
unstable-feeding-reactor-rampant=不稳定粉碎者食物反应堆

[item-description]
powerup-Combat5min-Capsule-rampantFixed=玩家直接摧毁Rampant巢穴时有小概率获得\n近战摧毁时概率更高（90<70<40<20<15）[color=green]\n使用时，给予玩家5分钟强化效果：\n - 无限弹药（如果超过1发）\n - 一击消灭虫族（仅限物理和爆炸伤害）\n - 对生命值4000+的虫族造成额外伤害而非秒杀[/color][color=red]\n如果主物品栏有弹药，将会被消耗[/color]
regenerationCrystal-rampantFixed=玩家在距离20或更近直接摧毁Rampant巢穴时有小概率获得\n可作为小型雷达工作，无需电力[color=green]\n每5秒为附近玩家施加持续1分钟的再生效果\n首次尝试施加增益后变为无敌[/color][color=red]\n施加增益时有1%几率损毁，与目标数量无关[/color]
biterSupressor1-rampant=用于降低临时离开星球的威胁[color=green]\n将Rampant AI的攻击频率降低3倍。在防线被突破时防止大规模攻击[/color]\n不影响粉碎者、污染攻击或巢穴被毁反应[color=red]\n当玩家物理存在于星球上时，正面效果不生效。\n放置2个或以上时，正面效果不叠加[/color]
biterSupressor2-rampant=用于降低临时离开星球的威胁\n包含前一版本功能，外加：[color=green]\n将粉碎者攻击间隔延长1.5倍。对喂食也生效\n将由Rampant AI控制的攻击小队最大规模减半[/color]
biterSupressor3-rampant=用于降低临时离开星球的威胁\n包含前一版本功能，外加：[color=green]\n在100%持续供电情况下，星球上的进化度将不会增长[/color]
demolisher-food-rocket-rampant=射向攻击中的粉碎者。至少2小时内它不会返回。大型粉碎者可进食更多
unstable-feeding-reactor-rampant=放置时爆炸，释放多枚导弹。毁灭者将在8小时内不会来找你。极度危险


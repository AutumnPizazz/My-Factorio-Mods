[mod-setting-description]
custom-metallic-Iron-Amount=基础破碎过程中产生的铁的量。
custom-metallic-Copper-Amount=基础破碎过程中产生的铜的量。
custom-metallic-Uranium-Amount=基础破碎过程中产生的铀的量。
custom-metallic-ChunkReturn-Chance=进行基础破碎时返回碎块的几率。概率值介于0和1之间。
custom-metallic-Uranium-Chance=基础破碎产生铀的几率。概率值介于0和1之间。
custom-metallic-advanced-Iron-Amount=高级破碎过程中产生的铁的量。
custom-metallic-advanced-Copper-Amount=高级破碎过程中产生的铜的量。
custom-metallic-advanced-Uranium-Amount=高级破碎过程中产生的铀的量。
custom-metallic-advanced-ChunkReturn-Chance=进行高级破碎时返回碎块的几率。概率值介于0和1之间。
custom-metallic-advanced-Uranium-Chance=高级破碎产生铀的几率。概率值介于0和1之间。

[mod-name]
factories-in-tight-spaces=紧凑空间工厂

[factories-in-tight-spaces]
on-start-mechanics-explanation-1=[img=info] 欢迎来到「紧凑空间工厂」！如果你没有出生在一座小岛上，请返回主菜单并选择「紧凑空间小岛」地图生成预设。
on-start-mechanics-explanation-2=[img=info] 你可以在「岛屿管理」分类中采集浮木，并用其中的配方制作可放置的无限资源矿脉。
on-start-mechanics-explanation-3=[img=info] 如果你想移除某片矿脉以更换资源类型，可以使用矿石擦除器（你可能需要点击工具栏右上角的三个点，把矿石擦除器添加到快捷栏）。
on-start-mechanics-explanation-4=[img=info] 获得更多填埋材料的唯一途径是研究科技。研究完成后，制作地图的玩家将获得全部填埋材料；若研究完成时其背包已满，多余的填埋材料会掉落到地面上。
on-start-mechanics-explanation-5=[img=info] 如果你的起始小岛是由填埋材料构成的，可以把填埋材料图标加到快捷栏来重新整理它。这样即使填埋材料已经全部铺好，你也能在没有机器人的情况下手动采掘它们。

[mod-setting-name]
fits-landfill-distribution-strategy=填埋材料分配策略
fits-landfill-multiplier=填埋材料倍率
fits-landfill-starting-island=起始小岛使用填埋材料
fits-starting-island-size=填埋小岛尺寸

[mod-setting-description]
fits-landfill-distribution-strategy=控制研究完成后填埋材料的发放方式。
fits-landfill-multiplier=每次研究获得的填埋材料数量的倍率（向上取整）。
fits-landfill-starting-island=启用后会把整个起始区域替换为填埋材料，让岛屿形状更自由。
fits-starting-island-size=填埋起始小岛的边长（以格为单位）。

[string-mod-setting]
fits-landfill-distribution-strategy-all-to-main-player=全部给主玩家
fits-landfill-distribution-divided-to-all-active-players=平均分给所有在线玩家
fits-landfill-distribution-replicate-for-all-active-players=每位在线玩家各得一份

[string-mod-setting-description]
fits-landfill-distribution-strategy-all-to-main-player=填埋扩张研究会把所有填埋材料给最先加入该存档的在线玩家（通常是主机）。
fits-landfill-distribution-divided-to-all-players=填埋扩张研究会把填埋材料尽可能平均地分给所有在线玩家。
fits-landfill-distribution-replicate-for-all-players=填埋扩张研究会给每位在线玩家各发放一份完整的填埋材料。推荐 3 人以上的服务器使用。

[map-gen-preset-name]
fits-tight-spaces-island=紧凑空间小岛

[map-gen-preset-description]
fits-tight-spaces-island=在一座贫瘠的小岛上开局。在岛上勘探无限矿脉，并用科技逐步扩张小岛。

[noise-expression]
fits-square-island=方形小岛

[technology-name]
fits-add-landfill=岛屿扩张
nullius-fits-add-landfill=岛屿扩张

[technology-description]
fits-add-landfill=提供更多填埋材料。默认每个科技层级 500 个。

[item-group-name]
fits-island-management=岛屿管理


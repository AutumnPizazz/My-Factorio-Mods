[mod-name]
StoneFromOxide=星岩可转化为石矿

[mod-setting-name]
custom-oxide-Ice-Amount=基础冰产量
custom-oxide-Calcite-Amount=基础方解石产量
custom-oxide-Stone-Amount=基础石头产量
custom-oxide-ChunkReturn-Chance=基础碎块返回几率
custom-oxide-advanced-Ice-Amount=高级冰产量
custom-oxide-advanced-Calcite-Amount=高级方解石产量
custom-oxide-advanced-Stone-Amount=高级石头产量
custom-oxide-advanced-ChunkReturn-Chance=高级碎块返回几率

[mod-setting-description]
custom-oxide-Ice-Amount=基础破碎过程中产生的冰的量。
custom-oxide-Calcite-Amount=基础破碎过程中产生的方解石的量。
custom-oxide-Stone-Amount=基础破碎过程中产生的石头的量。
custom-oxide-ChunkReturn-Chance=进行基础破碎时返回碎块的几率。概率值介于1和0之间。
custom-oxide-advanced-Ice-Amount=高级破碎过程中产生的冰的量。
custom-oxide-advanced-Calcite-Amount=高级破碎过程中产生的方解石的量。
custom-oxide-advanced-Stone-Amount=高级破碎过程中产生的石头的量。
custom-oxide-advanced-ChunkReturn-Chance=进行高级破碎时返回碎块的几率。概率值介于1和0之间。

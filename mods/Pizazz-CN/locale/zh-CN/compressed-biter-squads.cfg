[mod-name]
compressed-biter-squads=压缩虫族小队

[mod-description]
compressed-biter-squads=尝试降低地图上分散的虫巢所造成的巨大 UPS 压力。

[mod-setting-name]
compressed-biter-squads-enable=启用虫群压缩
compressed-biter-squads-right-after=立即压缩虫群
compressed-biter-squads-only-enemy=仅压缩「敌对」阵营

[mod-setting-description]
compressed-biter-squads-enable=停止压缩之后新生成的虫群。已经在运作的压缩虫群照常运行。
compressed-biter-squads-right-after=在虫群刚形成时立即压缩，而不是等集结完成、下达移动命令之后再压缩。\n\n这可能干扰其它依赖单位的模组。\n显著提升 UPS。
compressed-biter-squads-only-enemy=如果你使用了添加虫族阵营的模组，关闭此项可能会有用。
rampant--maxNumberOfBuilders_compressed_biter_squads=__1__\n\n此项设置的上限由「压缩虫族小队」解锁。请记住，同时活跃的虫群越多，UPS 消耗仍然越大；当 Rampant 进入 AGGRESSIVE（攻击性）状态时会形成大量虫群！
rampant--maxNumberOfSquads_compressed_biter_squads=__1__\n\n此项设置的上限由「压缩虫族小队」解锁。请记住，同时活跃的虫群越多，UPS 消耗仍然越大！

[controls]
bbb-toggle-priority=切换传送带优先

[controls-description]
bbb-toggle-priority=指向一个均衡器部件并按下此键，即可让它连接的传送带获得优先。优先的输出会先于均衡器的其它输出被填满，而没有优先的部分仍会在它们之间平均分配。此版本支持为离开均衡器的传送带设置优先；送入均衡器的传送带暂时不能设置。带优先的部件上会有一个标记。

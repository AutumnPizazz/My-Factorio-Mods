[mod-name]
better-belt-balancer=更好的传送带均衡器

[mod-description]
better-belt-balancer=可以像积木一样拼合成任意形状的传送带均衡器。性能极高，适合巨型基地（UPS 开销与原版手工搭建的传送带均衡器大致相同）。

[entity-name]
bbb-balancer-part=均衡器部件
bbb-linked-belt=均衡器
bbb-belt=均衡器
bbb-splitter=均衡器
bbb-lane-splitter=均衡器
bbb-legacy-stub=均衡器迁移标记
balancer-part=传送带均衡器

[entity-description]
bbb-balancer-part=把若干个并排放置，它们就会合成一个均衡器。送入它的传送带是它的输入，由它送出的传送带是它的输出。

[item-name]
bbb-balancer-part=均衡器部件

[item-description]
bbb-balancer-part=一种 1x1 的方块，可与任意相邻的均衡器部件连接。仅由传送带的朝向决定哪一侧是输入、哪一侧是输出。

[recipe-name]
bbb-balancer-part=均衡器部件

[technology-name]
bbb-balancer=传送带均衡

[technology-description]
bbb-balancer=任意形状的均衡器，一次一格地搭建。

[bbb]
over-port-limit=一个均衡器每侧最多连接 __1__ 条传送带；这一个会有 __2__ 条。
over-port-limit-unconnected=一个均衡器每侧最多连接 __1__ 条传送带；这一个会有 __2__ 条。多出的部分留在原地，未连接。
single-edge-refused=每个均衡器部件只连接一条传送带。这个均衡器中有一个部件会有 __1__ 条。
single-edge-refused-unconnected=每个均衡器部件只连接一条传送带。这个均衡器中有一个部件会有 __1__ 条。多出的部分留在原地，未连接。
single-edge-migrated=你的 __1__ 个均衡器把多条传送带接到同一个部件上，而 Factorio 2.1 不允许这样——现在每个部件只连接一条传送带。它们已停止工作，原本运送的物品落在它们旁边的地上。请按每个部件一条传送带重建它们：__2__
single-edge-migrated-untouched=你的 __1__ 个均衡器把多条传送带接到同一个部件上，而 Factorio 2.1 不允许这样——现在每个部件只连接一条传送带。它们已停止工作；其传送带上的物品未受影响。请按每个部件一条传送带重建它们：__2__
single-edge-grandfathered=你的 __1__ 个均衡器把多条传送带接到同一个部件上。这个存档仍可正常运行，但新建的均衡器每个部件只连接一条传送带，而这些均衡器在 Factorio 2.1 上将会停止工作。它们存在时无法关闭该设置：请先按每个部件一条传送带重建它们，然后在 设置 > 模组设置 > 地图 中关闭「允许每个均衡器部件连接多条传送带」。__2__
curved-exits-kept=你的 __1__ 个均衡器有一条传送带横穿某个部件的表面。这些均衡器建成时那条传送带没有连接到任何东西，而现在它会被当作输出，因此本存档保持旧行为：在 设置 > 模组设置 > 地图 中为它关闭了「传送带离开均衡器时可以转向」。开启该项即可使用新行为；受影响的均衡器如下：__2__
ping-list-continued=……以及：__1__
priority-on=优先已开启
priority-off=优先已关闭
priority-refused=这个均衡器太大，无法为某条传送带设置优先。它最繁忙的一侧连接了 __1__ 条传送带。
priority-too-big=这个均衡器太大，无法为某条传送带设置优先。它最繁忙的一侧将连接 __1__ 条传送带。
priority-too-big-unconnected=这个均衡器太大，无法为某条传送带设置优先。它最繁忙的一侧将连接 __1__ 条传送带。多出的部分留在原地，未连接。
priority-input-refused=在此版本中，只有离开均衡器的传送带才能设置优先。有一条送入该均衡器的传送带设置了优先，因此未做任何更改。
priority-input=在此版本中，只有离开均衡器的传送带才能设置优先，而有一条送入该均衡器的传送带设置了优先。
priority-input-unconnected=在此版本中，只有离开均衡器的传送带才能设置优先，而有一条送入该均衡器的传送带设置了优先。多出的部分留在原地，未连接。
priority-holding=在此处更改优先会使这个均衡器变小，而它现在太满了，无法这样做。请先让它排空。

[mod-setting-name]
bbb-recipe-cost=均衡器部件配方
better-belt-balancer-recipe-ingredients=均衡器部件原料
bbb-tech-cost=均衡器研究成本
better-belt-balancer-tech-packs=均衡器研究：科技包
better-belt-balancer-tech-count=均衡器研究：单位数
better-belt-balancer-tech-seconds=均衡器研究：每单位所需秒数
bbb-multi-edge-parts=允许每个均衡器部件连接多条传送带（仅 Factorio 2.0）
bbb-curved-exits=传送带离开均衡器时可以转向

[mod-setting-description]
bbb-recipe-cost=制作一个均衡器部件所需的花费。默认值即本模组一直使用的配方。你自己填写的列表会按原样采用：你输入的名称不会被替换成别的。
better-belt-balancer-recipe-ingredients=均衡器部件由哪些材料制成。先写数量，再写物品的内部名称，多种原料之间用逗号分隔：2 iron-plate, 1 splitter。内部名称是游戏在其自身数据和富文本中使用的名称，而不是屏幕上显示的名称。上方设置的提示框按同样格式列出了所有预设，可以从那里复制一份。
bbb-tech-cost=均衡器自身的研究按哪一级物流科技定价。成本会从该科技复制，因此随你所装模组的收费而变，该研究在科技树中也紧跟在它之后。如果你装的模组没有给某一级定价，则向下顺延到下一级传送带；若都没有，则该研究消耗 20 个自动化科技包、每个 15 秒，且没有前置科技。下面三项设置会逐字段覆盖该级科技：科技包字段只要不是「默认」就生效，单位数与秒数只要有一项不为 0 就生效。
better-belt-balancer-tech-packs=均衡器研究用什么支付。先写数量，再写科技包的内部名称，多个科技包之间用逗号分隔：1 automation-science-pack, 1 logistic-science-pack。只接受科技包；内部名称是游戏在其自身数据和富文本中使用的名称，而不是屏幕上显示的名称。
better-belt-balancer-tech-count=均衡器研究消耗多少个科技单位。
better-belt-balancer-tech-seconds=均衡器研究在实验室中每个单位需要多少秒。
bbb-multi-edge-parts=默认关闭。均衡器部件通常只连接一条传送带。Factorio 2.0 可以把多条传送带接到同一个部件上，从而搭出更小的均衡器——但 Factorio 2.1 做不到，这样搭出的均衡器在游戏更新后会停止工作。对于已经用过该功能的存档，本模组会自动为它开启此设置。
bbb-curved-exits=默认开启。铺在均衡器部件空闲面上、其后方没有任何东西的传送带即为该部件的输出，并会从均衡器处转开，因此转弯处不必先放一格直带。关闭此项会恢复 0.3.3 版本之前的行为：这样的传送带保持未连接，只有正对部件向外指的传送带才算输出。更改此设置会重新检查存档中的每一个均衡器。

